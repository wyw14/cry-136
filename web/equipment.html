<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreGuard Equipment</title><style>body{font-family:system-ui;background:#eef2f4;color:#18242c;margin:0}header{background:#12333b;color:#fff;padding:20px 28px}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d6e0e3;padding:18px;border-radius:6px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e6ecee;text-align:left}.ok{color:#087f5b}.blocked{color:#b42318}</style></head><body><header><strong>CoreGuard</strong><span> / Equipment</span></header><main><section class="panel"><h2>Equipment state</h2><table><thead><tr><th>Equipment</th><th>State</th><th>Revision</th></tr></thead><tbody id="equipment"></tbody></table></section></main><script>async function load(){const rows=await (await fetch('/api/equipment')).json();document.querySelector('#equipment').innerHTML=rows.map(x=>`<tr><td>${x.name}</td><td class="${x.state==='blocked'?'blocked':'ok'}">${x.state}</td><td>${x.revision}</td></tr>`).join('')}load()</script></body></html>
