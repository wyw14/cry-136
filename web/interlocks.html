<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreGuard Interlocks</title><style>body{font-family:system-ui;background:#eef2f4;color:#18242c;margin:0}header{background:#12333b;color:#fff;padding:20px 28px}main{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.panel{background:#fff;border:1px solid #d6e0e3;padding:18px;border-radius:6px}.state{font-size:1.5rem;font-weight:700}.engaged{color:#b42318}.clear{color:#087f5b}</style></head><body><header><strong>CoreGuard</strong><span> / Interlocks</span></header><main><div class="grid" id="interlocks"></div></main><script>async function load(){const rows=await (await fetch('/api/interlocks')).json();document.querySelector('#interlocks').innerHTML=rows.map(x=>`<section class="panel"><h2>${x.name}</h2><div class="state ${x.engaged?'engaged':'clear'}">${x.engaged?'ENGAGED':'CLEAR'}</div><p>${x.reason||'No active reason'}</p></section>`).join('')}load()</script></body></html>
