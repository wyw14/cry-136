<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreGuard Incidents</title><style>body{font-family:system-ui;background:#eef2f4;color:#18242c;margin:0}header{background:#12333b;color:#fff;padding:20px 28px}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #d6e0e3;padding:18px;border-radius:6px}.incident{padding:14px 0;border-bottom:1px solid #e6ecee}.critical{color:#b42318;font-weight:700}.muted{color:#5f6d75}</style></head><body><header><strong>CoreGuard</strong><span> / Incidents</span></header><main><section class="panel"><h2>Incident log</h2><div id="incidents" class="muted">Loading...</div></section></main><script>async function load(){const rows=await (await fetch('/api/incidents')).json();document.querySelector('#incidents').innerHTML=rows.length?rows.map(x=>`<div class="incident"><div class="${x.severity}">${x.severity.toUpperCase()}</div><div>${x.message}</div><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'No incidents recorded'}load()</script></body></html>
