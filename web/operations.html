<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreGuard Operations</title><style>body{font-family:system-ui;background:#eef2f4;color:#18242c;margin:0}header{background:#12333b;color:#fff;padding:20px 28px}main{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.panel{background:#fff;border:1px solid #d6e0e3;padding:18px;border-radius:6px}button{background:#0f7770;color:#fff;border:0;padding:10px 14px;border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e6ecee;text-align:left}</style></head><body><header><strong>CoreGuard</strong><span> / Operations</span></header><main><div class="grid"><section class="panel"><h2>Cycle</h2><p id="cycle">Loading...</p><button id="start">Start cycle</button><button id="scram">SCRAM</button></section><section class="panel"><h2>Core telemetry</h2><p id="core">Loading...</p></section></div><section class="panel"><h2>Recent operations</h2><table><thead><tr><th>Name</th><th>Status</th><th>Created</th></tr></thead><tbody id="operations"></tbody></table></section></main><script>async function refresh(){const r=await fetch('/api/operations');const a=await r.json();const e=await (await fetch('/api/equipment')).json();document.querySelector('#operations').innerHTML=a.map(x=>`<tr><td>${x.name}</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('');document.querySelector('#cycle').textContent=e.length?`${e[0].state} / revision ${e[0].revision}`:'No active cycle'}document.querySelector('#start').onclick=async()=>{await fetch('/api/cycle/start',{method:'POST'});refresh()};document.querySelector('#scram').onclick=async()=>{await fetch('/api/cycle/scram',{method:'POST'});refresh()};refresh();</script></body></html>
